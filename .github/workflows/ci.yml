name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skeleton:
    name: PG18.6 / Debian12 / arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Build, install, and test
        run: ./scripts/test.sh
      - name: Build evaluation bundle
        run: ./scripts/package.sh
      - name: Install bundle on clean PostgreSQL runtime
        run: ./scripts/test-package.sh
      - name: Record build inputs
        run: |
          git rev-parse HEAD > artifacts/source-revision.txt
          docker image inspect pg_onesearch:0.1.0-dev --format '{{.Id}}' > artifacts/image-id.txt
          docker run --rm --network none --entrypoint sh pg_onesearch:0.1.0-dev \
            -c 'pg_config --version; gcc --version; dpkg-query -W' > artifacts/build-environment.txt
      - name: Upload tested evaluation bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pg_onesearch-pg18.6-debian12-arm64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
