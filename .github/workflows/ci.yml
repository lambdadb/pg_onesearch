name: CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  skeleton:
    name: PG18.6 / Debian12 / arm64
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Live harness safety checks (offline)
        run: python3 -m unittest discover -s spikes/live_compatibility -p test_offline.py -v
      - name: Build, install, and test
        run: ./scripts/test.sh
      - name: Commit and worker feasibility probe
        run: |
          set -o pipefail
          ./scripts/test-commit-worker.sh 2>&1 | tee /tmp/pg_onesearch-commit-worker.log
      - name: Actual psql and Psycopg client contract
        run: |
          set -o pipefail
          ./scripts/test-client-contract.sh 2>&1 | tee /tmp/pg_onesearch-client-contract.log
      - name: Build evaluation bundle
        run: ./scripts/package.sh
      - name: C remote read transport (offline TLS fixture)
        run: |
          set -o pipefail
          ./scripts/test-remote-read.sh 2>&1 | tee /tmp/pg_onesearch-remote-read.log
      - name: Install bundle on clean PostgreSQL runtime
        run: ./scripts/test-package.sh
      - name: Custom Scan executor experiment
        run: |
          set -o pipefail
          ./scripts/test-executor.sh --reuse-transport-image 2>&1 | tee /tmp/pg_onesearch-executor.log
      - name: Index lifecycle and WAL recovery experiment
        run: |
          set -o pipefail
          ./scripts/test-index-lifecycle.sh --reuse-client-image 2>&1 | tee /tmp/pg_onesearch-index-lifecycle.log
      - name: Atomic source and outbox capture experiment
        run: |
          set -o pipefail
          ./scripts/test-change-capture.sh --reuse-lifecycle-image 2>&1 | tee /tmp/pg_onesearch-change-capture.log
      - name: Fenced batch replay and publication experiment
        run: |
          set -o pipefail
          ./scripts/test-batch-replay.sh --reuse-capture-image 2>&1 | tee /tmp/pg_onesearch-batch-replay.log
      - name: Record build inputs
        run: |
          git rev-parse HEAD > artifacts/source-revision.txt
          cp /tmp/pg_onesearch-commit-worker.log artifacts/commit-worker-probe.log
          cp /tmp/pg_onesearch-client-contract.log artifacts/client-contract.log
          cp /tmp/pg_onesearch-remote-read.log artifacts/remote-read.log
          cp /tmp/pg_onesearch-executor.log artifacts/executor.log
          cp /tmp/pg_onesearch-index-lifecycle.log artifacts/index-lifecycle.log
          cp /tmp/pg_onesearch-change-capture.log artifacts/change-capture.log
          cp /tmp/pg_onesearch-batch-replay.log artifacts/batch-replay.log
          docker image inspect pg_onesearch:0.1.0-dev --format '{{.Id}}' > artifacts/image-id.txt
          docker run --rm --network none --entrypoint sh pg_onesearch:0.1.0-dev \
            -c 'pg_config --version; gcc --version; dpkg-query -W' > artifacts/build-environment.txt
      - name: Upload tested evaluation bundle
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pg_onesearch-pg18.6-debian12-arm64-${{ github.sha }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
